name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare release assets
        id: prep
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          cp build/app/outputs/flutter-apk/app-release.apk Weekend-v${VERSION}.apk
          cp build/app/outputs/flutter-apk/app-release.apk Weekend-latest.apk
          shasum -a 256 Weekend-v${VERSION}.apk Weekend-latest.apk > SHA256SUMS.txt
          echo "SHA256SUMS:"
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Weekend ${{ steps.prep.outputs.version }}
          body: |
            ## Weekend v${{ steps.prep.outputs.version }}

            Production release of Weekend - Flutter Edition.

            ### Download
            - **Weekend-v${{ steps.prep.outputs.version }}.apk** - Versioned production APK
            - **Weekend-latest.apk** - Stable latest download link

            ### Verify
            SHA-256 checksums are provided in `SHA256SUMS.txt`.

            ### Install
            1. Download the APK
            2. Enable "Install from unknown sources" if prompted
            3. Open the APK to install

            ### Requirements
            - Android 7.0+ (API 24)
            - ~55 MB storage
          files: |
            Weekend-v${{ steps.prep.outputs.version }}.apk
            Weekend-latest.apk
            SHA256SUMS.txt
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
