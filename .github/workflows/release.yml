name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare release assets
        id: prep
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          cp build/app/outputs/flutter-apk/app-release.apk Weekend-v${VERSION}-release.apk
          shasum -a 256 Weekend-v${VERSION}-release.apk > Weekend-v${VERSION}-release.apk.sha256
          cat Weekend-v${VERSION}-release.apk.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Weekend v${{ steps.prep.outputs.version }}
          body: |
            ## Weekend v${{ steps.prep.outputs.version }}

            Weekend — Make Every Weekend Brighter.
            Free, open-source dating and social discovery app for Android (Flutter + Supabase).

            ### Download
            - **Weekend-v${{ steps.prep.outputs.version }}-release.apk** — Android APK (Android 7.0 / API 24+)
            - **Weekend-v${{ steps.prep.outputs.version }}-release.apk.sha256** — SHA-256 checksum

            ### Verify the download
            ```bash
            # macOS / Linux
            shasum -a 256 Weekend-v${{ steps.prep.outputs.version }}-release.apk
            ```
            ```powershell
            # Windows (PowerShell)
            Get-FileHash .\Weekend-v${{ steps.prep.outputs.version }}-release.apk -Algorithm SHA256
            ```
            Compare the result with the published `.sha256` asset before installing.

            ### Install
            1. Download the APK.
            2. Open it and confirm Android's standard "install from this source" prompt.
            3. Launch Weekend and sign in, or create an account.

            Full instructions: https://github.com/zypherlabs-bit/Weekend/blob/master/docs/installation.md
            Documentation: https://github.com/zypherlabs-bit/Weekend/tree/master/docs
            Security policy: https://github.com/zypherlabs-bit/Weekend/blob/master/SECURITY.md

            ### Requirements
            - Android 7.0+ (API 24)
            - arm64-v8a / armeabi-v7a / x86_64
          files: |
            Weekend-v${{ steps.prep.outputs.version }}-release.apk
            Weekend-v${{ steps.prep.outputs.version }}-release.apk.sha256
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
