# Daily analytics snapshot for the GitHub Pages dashboard.
#
# Schedule interpretation: cron expressions run on UTC clocks, so
# "0 0 * * *" fires every day at 00:00 UTC = 05:30 IST (Asia/Kolkata),
# i.e. the snapshot for a UTC day is written just after that day begins.
name: Update Analytics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# Minimal permissions: push the data commit and trigger a Pages rebuild.
# The token is never printed; the script only reads it from the environment.
permissions:
  contents: write
  pages: write

concurrency:
  group: update-analytics
  cancel-in-progress: false

jobs:
  update-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch GitHub analytics and update snapshot
        env:
          # The built-in GITHUB_TOKEN cannot read /traffic/* (HTTP 403),
          # so prefer the ANALYTICS_TRAFFIC_TOKEN repository secret (a
          # fine-grained/classic PAT with read access) when configured and
          # fall back to github.token otherwise — release/download metrics
          # still update without it. The value is masked in logs.
          GH_TOKEN: ${{ secrets.ANALYTICS_TRAFFIC_TOKEN || github.token }}
        run: python3 .github/scripts/update-analytics.py

      - name: Commit and push analytics data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/analytics/data/daily.json
          if git diff --cached --quiet; then
            echo "No analytics changes to commit."
            exit 0
          fi
          git commit -m "chore(analytics): daily snapshot $(date -u +%F)"
          git push

      - name: Refresh GitHub Pages
        # GITHUB_TOKEN pushes do not trigger a Pages build on their own,
        # so request one explicitly. continue-on-error keeps a transient
        # Pages API hiccup from failing an otherwise successful snapshot.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
