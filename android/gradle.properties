# Gradle JVM sizing.
#
# The previous value here was -Xmx8G -XX:MaxMetaspaceSize=4G, which asks for up
# to ~12 GB. On a machine with less physical RAM than that (this host has ~7.9 GB
# total), the JVM cannot reserve the heap and the Gradle daemon dies mid-build
# with "Gradle build daemon disappeared unexpectedly" plus a hs_err_pid*.log.
# It surfaces as an unrelated-looking crash inside a plugin's Kotlin compile,
# so it is easy to misdiagnose as a dependency problem.
#
# These values stay inside a ~6 GB worst case, which leaves headroom for the
# OS, the Dart/Flutter tooling and the emulator on an 8 GB host. Raise them only
# on a machine that actually has the RAM to back it.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# R8/D8 shrinking the release bundle and running the Kotlin compiler in
# parallel is what actually exhausts the heap on a small host. Capping the
# worker count keeps peak memory well below the 3 GB heap above.
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true

# R8 runs in-process by default, which competes with the Gradle daemon for the
# same heap. Offloading it to a worker process keeps the daemon alive.
android.enableR8.fullMode=false

android.useAndroidX=true
