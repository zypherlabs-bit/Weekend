name: weekend
description: "Weekend - Make Every Weekend Brighter. Free open-source dating & social discovery app"
publish_to: 'none'
version: 2.1.0+3

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.4
  supabase: ^2.6.3

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # UI Components
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  lottie: ^3.3.1

  # Image handling
  image_picker: ^1.1.2
  image_editor: ^1.4.0
  image: ^4.5.4
  photo_view: ^0.15.0
  path_provider: ^2.1.5

  # Location
  geolocator: ^13.0.2
  permission_handler: ^11.4.0
  geocoding: ^3.0.0

  # Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.3

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  timeago: ^3.7.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.3

  # Networking
  http: ^1.3.0
  connectivity_plus: ^6.1.3

  # Notifications
  flutter_local_notifications: ^18.0.1

  # JSON serialization
  json_annotation: ^4.9.0
  local_auth: ^3.0.2
  crypto: ^3.0.7
  mobile_scanner: ^7.4.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2
  json_serializable: ^6.9.3
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/weekend_logo.png"
  adaptive_icon_background: "#FF6C5C"
  adaptive_icon_foreground: "assets/icons/weekend_logo_fg.png"
  adaptive_icon_round_background: "#FF6C5C"
  adaptive_icon_round_foreground: "assets/icons/weekend_logo_fg.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
