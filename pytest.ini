[pytest]
testpaths = tests/python
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# conftest.py lives beside the tests, so it must be importable by name.
pythonpath = .
addopts = -v --tb=short --strict-markers
markers =
    static: repository/configuration inspection
    runtime: executes real logic in-process
    device: requires a physical Android handset
