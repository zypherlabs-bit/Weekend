project_id = "weekend-local"

[api]
# Local Supabase API settings
enabled = true
port = 54327

[db]
# Local PostgreSQL settings
port = 5432
shadow_port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[edge_functions]
# Enable local edge functions
enabled = true
port = 54325

[realtime]
enabled = true
port = 54329

[storage]
enabled = true
file_storage_root_path = "./storage"

[auth]
enabled = true
port = 54324
site_url = "io.github.supabase.weekend://auth/callback"
additional_redirect_urls = ["weekend://auth/callback"]
jwt_expiry = 3600
refresh_token_rotation_enabled = true
secure_password_change_enabled = false

[auth.email]
enable_signup = true
email_confirm = false
double_confirm = true
enable_confirmable_sms = false
confirmable_sms = false

[auth.external.google]
enabled = true
client_id = "GOOGLE_CLIENT_ID"
client_secret = "GOOGLE_CLIENT_SECRET"
